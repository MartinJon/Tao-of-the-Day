name: tao_app_fixed_clean
description: "Tao of the Day App"

publish_to: 'none'

version: 1.1.0+83

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  # 3.3.0 brings Play Billing Library 8, which Google Play now requires.
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  in_app_purchase_platform_interface: ^1.4.0
  in_app_purchase_storekit: ^0.4.6

#  just_audio: ^0.9.35
#  audio_service: ^0.18.9
#  audio_session: ^0.1.20
  http: ^1.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  audioplayers: ^6.5.1  # ← Keep this commented out for now
  csv: ^5.0.3
  url_launcher: ^6.1.11
  package_info_plus: ^8.0.0
  provider: ^6.1.1

dependency_overrides:
  web: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.3.3
  flutter_launcher_icons: ^0.13.1

# ADD THIS SECTION for splash screen
flutter_native_splash:
  color: "#FFD26F"
  android: true
  ios: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
    uses-material-design: true

    assets:
      - lib/data/tao_data.json


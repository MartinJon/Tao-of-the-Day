workflows:
  android-release:
    name: Android Release (with underscore)
    environment:
      groups:
        - android_signing
      flutter: 3.38.10
    scripts:
      - name: Build Android with underscore
        script: |
          flutter clean
          flutter pub get
          echo $CM_KEYSTORE | base64 --decode > android/app/upload-keystore.jks
          ls -la android/app/upload-keystore.jks
          echo "Keystore file created successfully"
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - mjongarcia@gmail.com

  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.martinjon.taoapp
      flutter: 3.38.10
      xcode: latest
      cocoapods: default
    scripts:
      - name: Apply Codemagic signing profiles
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          flutter pub get
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - mjongarcia@gmail.com
